    function attachEvents() {
        const backBtn = document.getElementById('backBtn');
        if (backBtn) backBtn.addEventListener('click', (e) => { e.stopPropagation(); goBack(); });
        const homeBtn = document.getElementById('homeBtn');
        if (homeBtn) homeBtn.addEventListener('click', (e) => { e.stopPropagation(); goHome(); });
        document.querySelectorAll('[data-page]').forEach(el => {
            el.addEventListener('click', (e) => { e.stopPropagation(); const page = el.getAttribute('data-page'); if (page) navigateTo(page, true); });
        });
        document.querySelectorAll('.product-card[data-link]').forEach(card => {
            card.addEventListener('click', (e) => { e.stopPropagation(); const link = card.getAttribute('data-link'); if (link) navigateTo(link, true); });
        });
        document.querySelectorAll('.product-card:not([data-link])').forEach(card => {
            card.addEventListener('click', () => alert('Вы выбрали товар'));
        });
        document.querySelectorAll('.favorite-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); alert('Добавлено в избранное'); });
        });
        document.querySelectorAll('.category-btn, .lesson-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); alert(`Раздел: ${btn.innerText}`); });
        });
        const confirmBtn = document.getElementById('confirmOrder');
        if (confirmBtn) {
            confirmBtn.addEventListener('click', () => {
                const fio = document.getElementById('fio')?.value;
                const email = document.getElementById('email')?.value;
                const phone = document.getElementById('phone')?.value;
                const address = document.getElementById('address')?.value;
                if (!fio || !email || !phone || !address) alert('Пожалуйста, заполните все обязательные поля');
                else alert('Заказ оформлен! Спасибо за покупку!');
            });
        }
    }
    render();
